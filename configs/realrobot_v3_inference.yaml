# Use the SAME file on server and robot client. The robot's existing ORION
# P7 deployment YAML supplies arm_app ports, left-eye CORA topics and servo limits.
task: cup_stacking
input_mode: mono-left  # stereo requires real right cameras at all three mounts
inference:
  denoise_steps: 10
  actions_per_chunk: 4
  max_translation: 0.08  # meters from each arm's observation anchor
  max_rotation: 0.5     # radians from observation anchor
  max_skew_s: 0.035     # host acquisition timestamps; not exposure-sync certification
client:
  right_camera_topics:  # used only for stereo, in head/left-wrist/right-wrist order
    - rt/camera/head/right/image_rect
    - rt/camera/left_wrist/right/image_rect
    - rt/camera/right_wrist/right/image_rect
  interfaces_verified: false  # only true after recorded-pose/SDK and image parity checks
  raw_gripper_limits: [[0.0, 0.095], [0.0, 0.095]]  # P7 G2P width in metres; SDK converts to mm
  max_steps: 20
  max_round_trip_s: 2.0  # warm-up excluded; H100 measured 0.61-0.63s; includes network margin
  max_observation_age_s: 0.1
  max_anchor_translation: 0.005
  max_anchor_rotation: 0.05
